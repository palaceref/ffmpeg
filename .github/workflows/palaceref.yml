name: Build FFmpeg for PalaceRef

# One build: win64, LGPL, shared libraries, FFmpeg 8.1 (addins/8.1.sh pins the
# tag). Pushes to the palaceref branch build it to check a change; a manual run
# with "Publish release" also releases it, with the source of everything in it.
on:
  push:
    branches: [palaceref]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      doRelease:
        description: 'Publish a release'
        type: boolean
        default: false
      buildOnly:
        description: 'Only build ffmpeg, reusing the images'
        type: boolean
        default: false

permissions:
  contents: write  # Releases.
  packages: write  # The build images in ghcr.io.

# A newer build of the same branch replaces one still running.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_BUILDKIT: 1
  TARGET: win64
  VARIANT: lgpl-shared
  ADDIN: '8.1'

jobs:
  build_base:
    name: Build base image
    if: ${{ github.event.inputs.buildOnly != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Free Disk-Space
        run: ./util/free_disk_space.sh
      - name: Install buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config: .github/buildkit.toml
      - name: Login to Docker
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image Name
        id: imagename
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/base" >> $GITHUB_OUTPUT
      - name: Stop Commands
        run: T="$(echo -n ${{ github.token }} | sha256sum | head -c 64)" && echo -e "::add-mask::${T}\n::stop-commands::${T}"
      - name: Build base image
        uses: docker/build-push-action@v7
        with:
          context: images/base
          pull: true
          push: true
          provenance: false
          tags: ${{ steps.imagename.outputs.name }}:latest
          cache-to: type=registry,mode=max,ref=${{ steps.imagename.outputs.name }}:cache
          cache-from: type=registry,ref=${{ steps.imagename.outputs.name }}:cache
      - name: Get download cache key
        id: dl_cache
        run: echo "dltagname=$(./util/get_dl_cache_tag.sh)" >> $GITHUB_OUTPUT
      - name: Cache
        uses: actions/cache@v6
        with:
          path: .cache/downloads
          key: download-cache-${{ steps.dl_cache.outputs.dltagname }}
          restore-keys: |
            download-cache-
      - name: Update Cache
        run: |
          set -e
          ./download.sh
          ./util/clean_cache.sh
          tar czf .cache/cache.tar.gz .cache/downloads/*
      - name: Upload cache artifact
        uses: actions/upload-artifact@v7
        with:
          name: download-cache
          overwrite: true
          path: .cache/cache.tar.gz

  build_target_base:
    name: Build target base image
    if: ${{ github.event.inputs.buildOnly != 'true' }}
    needs: build_base
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Free Disk-Space
        run: ./util/free_disk_space.sh
      - name: Install buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config: .github/buildkit.toml
      - name: Login to Docker
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image Name
        id: imagename
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/base-${TARGET}" >> $GITHUB_OUTPUT
          echo "gh_repo=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT
      - name: Stop Commands
        run: T="$(echo -n ${{ github.token }} | sha256sum | head -c 64)" && echo -e "::add-mask::${T}\n::stop-commands::${T}"
      - name: Build target base image
        uses: docker/build-push-action@v7
        with:
          context: images/base-${{ env.TARGET }}
          pull: true
          push: true
          provenance: false
          tags: ${{ steps.imagename.outputs.name }}:latest
          cache-to: type=registry,mode=max,ref=${{ steps.imagename.outputs.name }}:cache
          cache-from: type=registry,ref=${{ steps.imagename.outputs.name }}:cache
          build-args: |
            GH_REPO=ghcr.io/${{ steps.imagename.outputs.gh_repo }}

  build_target:
    name: Build target-variant image
    if: ${{ github.event.inputs.buildOnly != 'true' }}
    needs: build_target_base
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Free Disk-Space
        run: ./util/free_disk_space.sh
      - name: Install buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config: .github/buildkit.toml
      - name: Login to Docker
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image Name
        id: imagename
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${TARGET}-${VARIANT}-${ADDIN}" >> $GITHUB_OUTPUT
      - name: Get download cache key
        id: dl_cache
        run: echo "dltagname=$(./util/get_dl_cache_tag.sh)" >> $GITHUB_OUTPUT
      - name: Stop Commands
        run: T="$(echo -n ${{ github.token }} | sha256sum | head -c 64)" && echo -e "::add-mask::${T}\n::stop-commands::${T}"
      - name: Generate Dockerfile
        run: ./generate.sh "$TARGET" "$VARIANT" "$ADDIN"
      - name: Cache
        uses: actions/cache/restore@v6
        with:
          path: .cache/downloads
          key: download-cache-${{ steps.dl_cache.outputs.dltagname }}
          fail-on-cache-miss: true
      - name: Build target-variant image
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          push: true
          provenance: false
          tags: ${{ steps.imagename.outputs.name }}:latest
          cache-to: type=registry,mode=max,ref=${{ steps.imagename.outputs.name }}:cache
          cache-from: type=registry,ref=${{ steps.imagename.outputs.name }}:cache

  build_ffmpeg:
    name: Build ffmpeg
    if: ${{ ( github.event.inputs.buildOnly == 'true' && !cancelled() ) || success() }}
    needs: build_target
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Free Disk-Space
        run: ./util/free_disk_space.sh
      - name: Login to Docker
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build ffmpeg
        run: |
          T="$(echo -n ${{ github.token }} | sha256sum | head -c 64)" && echo -e "::add-mask::${T}\n::stop-commands::${T}"
          ./build.sh "$TARGET" "$VARIANT" "$ADDIN"
      - name: Check for GPL code
        # The reason this fork exists: fail rather than ship GPL code again.
        # Markers only linked code carries (the configure line inside the
        # binaries names chromaprint and zvbi too, in lower case).
        run: |
          set -e
          cd artifacts
          unzip -q -o ffmpeg-*.zip -d check
          found="$(grep -a -o -h -E 'fftw-3[0-9.]*|fftw_wisdom|Chromaprint|Libzvbi' check/*/bin/*.dll check/*/bin/*.exe | sort -u || true)"
          rm -rf check
          if [ -n "$found" ]; then
            echo "$found"
            echo "::error::GPL components found in the build"
            exit 1
          fi
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-build
          overwrite: true
          path: artifacts/*

  publish_release:
    name: Publish release
    if: ${{ !cancelled() && github.event.inputs.doRelease == 'true' && needs.build_ffmpeg.result == 'success' }}
    needs: build_ffmpeg
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Free Disk-Space
        run: ./util/free_disk_space.sh
      - name: Download build
        uses: actions/download-artifact@v8
        with:
          name: ffmpeg-build
          path: artifacts
      - name: Download sources
        uses: actions/download-artifact@v8
        with:
          name: download-cache
          path: sources-archive
      - name: Gather sources
        # The LGPL asks that the source of what ships stay available: FFmpeg at
        # its tag, and every library at the commit the build used (the download
        # cache holds one archive per scripts.d stage). The recipes are this
        # repository at the release's tag.
        run: |
          set -e
          mkdir sources
          tar xzf sources-archive/cache.tar.gz
          find .cache/downloads -type f -name '*.tar.xz' -exec sh -c 'cp "$1" "sources/source-$(basename "$1")"' _ {} \;
          FFTAG="$(sed -n 's/^GIT_BRANCH="\(.*\)"/\1/p' addins/${ADDIN}.sh)"
          curl -fsSL -o "sources/source-ffmpeg-${FFTAG}.tar.gz" "https://github.com/FFmpeg/FFmpeg/archive/refs/tags/${FFTAG}.tar.gz"
          echo "FFTAG=${FFTAG}" >> $GITHUB_ENV
      - name: Create release
        run: |
          set -xe
          STAMP="$(date +'%Y%m%d-%H%M')"
          TAGNAME="palaceref-${FFTAG}-${STAMP}"
          ZIP="$(ls artifacts/*.zip)"
          (cd artifacts && sha256sum *.zip > checksums.sha256)
          (cd sources && sha256sum * >> ../artifacts/checksums.sha256)
          {
            echo "FFmpeg ${FFTAG} for PalaceRef: \`$(basename "$ZIP")\`"
            echo
            echo "BtbN's win64 LGPL shared build without its GPL components (chromaprint, FFTW, zvbi), built from this repository at ${GITHUB_SHA}."
            echo
            if compgen -G "patches/ffmpeg/${FFTAG}/*.patch" >/dev/null; then
              echo "FFmpeg is ${FFTAG} with these upstream commits applied, from \`patches/ffmpeg/${FFTAG}\`:"
              for p in patches/ffmpeg/${FFTAG}/*.patch; do
                # A backport names the upstream commit it was picked from.
                SHA="$(sed -n 's/^(cherry picked from commit \([0-9a-f]*\).*/\1/p' "$p")"
                [[ -n "$SHA" ]] || SHA="$(head -1 "$p" | cut -d' ' -f2)"
                # The subject header may continue on indented lines.
                SUBJECT="$(awk '/^Subject: /{s=substr($0,10); while ((getline l) > 0 && l ~ /^ /) s=s l; print s; exit}' "$p")"
                echo "- ${SHA:0:12} ${SUBJECT#\[PATCH\] }"
              done
              echo
            fi
            echo "SHA-256: \`$(sha256sum "$ZIP" | cut -d' ' -f1)\`"
            echo
            echo "Source: \`source-ffmpeg-${FFTAG}.tar.gz\` is FFmpeg's at the tag, before the patches in the recipes; each other \`source-*.tar.xz\` is one library's, at the commit its scripts.d stage pins; the build recipes are this release's \"Source code\" archive."
          } > release_body.md
          gh release create "$TAGNAME" --target "$GITHUB_SHA" --title "FFmpeg ${FFTAG} for PalaceRef (${STAMP})" \
            --notes-file release_body.md "$ZIP" artifacts/checksums.sha256 sources/*
        env:
          GITHUB_TOKEN: ${{ github.token }}
